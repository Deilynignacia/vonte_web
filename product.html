<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Vonté Store</title>
  <meta name="description" content="View product details, pricing, and add items to your cart!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/png" href="assets/icons/vonte-favicon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/desktop-styles.css">
  <link rel="stylesheet" href="css/desktop-store.css">
</head>

<body>
  <header class="site-header">
    <nav class="main-nav">
      <button class="menu-button" aria-label="Open navigation menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <a href="index.html" class="logo">
        <img src="assets/icons/logo.png" alt="Vonté logo">
      </a>
      <div class="nav-actions">
            <a href="cart.html" class="icon-button" aria-label="Shopping cart">
            <i class="fa-solid fa-cart-shopping"></i>
        </a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About Us</a></li>
        <li><a href="index.html#performances">Performances</a></li>
        <li><a href="index.html#gallery">Gallery</a></li>
        <li><a href="store.html">Store</a></li>
      </ul>
    </nav>
  </header>

<main>
    <section class="product-details">
      <!-- Image -->
      <div class="product-image-container">
        <img id="productImage" src="" alt="Loading...">
      </div>
      
      <!-- Test and button -->
      <div class="product-info-container">
        <h2>Loading...</h2>
        <p id="productPrice" class="product-price"></p>
        <p id="productDesc"></p>
        <button id="addToCart" class="button">Add to Cart</button>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Vonté. All rights reserved.</p>
  </footer>

  <script type="module" src="scripts/product.mjs"></script>
</body>
</html>
